# Windows の自動更新（インストーラの上書きと再起動）を本物の Windows で通しで確かめる。
#
# 目的: 「更新して再起動」を押しても更新されない・再起動しない不具合（2026-11）の回帰テスト。
#   アプリはインストーラを /VERYSILENT /SUPPRESSMSGBOXES /CLOSEAPPLICATIONS で起動してから自分で終了する。
#   インストーラは旧プロセス（voicekey.exe）が終わるのを待ってからファイルを置き換え、新版を起動する。
#
# 確かめること:
#   1. 配布物が小さいこと（torch を入れない）
#   2. いま配布中の v2.5.3 が動いたままでも、新版のインストーラで入れ替わり、新版が起動して落ちないこと
#   3. 旧プロセスが途中で終わる場合: すぐ入れ替わり、新しいプロセスが起動している
#   4. 旧プロセスが終わらない場合: 30 秒待ってから強制で閉じ、同じく成功して新しいプロセスが起動している
#
# 同じ dist から版番号だけ違うインストーラを 2 本作って入れ替える（アプリ内の版は同じで構わない）。
# 鍵・課金 API・リリースには一切触れない。

name: Windows 更新 e2e

on:
  workflow_dispatch:
  push:
    paths:
      - installer/**
      - voicekey.spec
      - scripts/build/build_windows_dist.ps1
      - src/utils/updater.py
      - src/main.py
      - src/core/vad.py
      - .github/workflows/windows-update-e2e.yml

jobs:
  update-e2e:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージのインストール
        run: pip install -r requirements.txt

      - name: Inno Setup 6 の確認（ランナーに無ければ導入）
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: 配布ビルド（版 0.0.1）と版 0.0.2 のインストーラ
        shell: pwsh
        env:
          PYTHONHOME: ${{ env.pythonLocation }}
          PYTHONUTF8: "1"
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build\build_windows_dist.ps1 -Version 0.0.1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows\voicekey.iss /DAppVersion=0.0.2
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist\installer | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          $size = (Get-Item dist\installer\voicekey-0.0.1-windows-setup.exe).Length / 1MB
          if ($size -gt 200) { Write-Error "インストーラが大きすぎます（$([math]::Round($size,1)) MB）。torch 等が入っていないか確認"; exit 1 }

      - name: 更新を通しで試す
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Exe = Join-Path $env:LOCALAPPDATA "Programs\voicekey\voicekey.exe"
          $Key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{1EA86DED-3DDC-45D4-90DD-DB5B915A38B7}_is1"
          $Flags = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/CLOSEAPPLICATIONS", "/NORESTART")
          $LogDir = Join-Path $env:LOCALAPPDATA "voicekey\logs"

          function Get-App { Get-Process voicekey -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $Exe } | Select-Object -First 1 }
          function Wait-App([int]$sec) {
            for ($i = 0; $i -lt $sec * 2; $i++) { $p = Get-App; if ($p) { return $p }; Start-Sleep -Milliseconds 500 }
            return $null
          }
          function Install([string]$setup, [string]$log) {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $proc = Start-Process $setup -ArgumentList ($Flags + "/LOG=$log") -PassThru
            return @{ Proc = $proc; Watch = $sw }
          }
          function Finish($job, [string]$log, [string]$version) {
            $job.Proc.WaitForExit()
            $sec = [math]::Round($job.Watch.Elapsed.TotalSeconds, 1)
            Write-Host "  インストーラ終了コード $($job.Proc.ExitCode)・所要 $sec 秒"
            if ($job.Proc.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "インストーラが失敗しました（$($job.Proc.ExitCode)）" }
            $got = (Get-ItemProperty $Key).DisplayVersion
            if ($got -ne $version) { Get-Content $log -Tail 40; throw "版が $version になっていません（$got）" }
            return $sec
          }

          function Assert-NewAlive($old, [string]$log, [string]$what) {
            $new = Wait-App 30
            if (-not $new -or $new.Id -eq $old) { Get-Content $log -Tail 40; throw "$what の後に新しい voicekey.exe が起動していません" }
            Start-Sleep -Seconds 15
            if (-not (Get-Process -Id $new.Id -ErrorAction SilentlyContinue)) {
              if (Test-Path "$LogDir\error_log.txt") { Get-Content "$LogDir\error_log.txt" }
              throw "$what の後に起動した voicekey.exe が 15 秒以内に落ちました"
            }
            Write-Host "  $what OK（pid $old → $($new.Id)・15 秒後も動作中）"
          }

          Write-Host "== 1. いま配布中の v2.5.3 を入れて起動（実際の利用者と同じ旧版）"
          $Old = "$env:RUNNER_TEMP\voicekey-2.5.3-windows-setup.exe"
          curl.exe -sSfL -o $Old "https://github.com/Tomato-1101/voicekey/releases/download/v2.5.3/voicekey-2.5.3-windows-setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "v2.5.3 のインストーラを取得できませんでした" }
          $job = Install $Old "$env:RUNNER_TEMP\i1.log"
          Finish $job "$env:RUNNER_TEMP\i1.log" "2.5.3" | Out-Null
          if (-not (Wait-App 30)) { Start-Process $Exe }
          $app = Wait-App 30
          if (-not $app) { throw "v2.5.3 が起動していません" }
          Start-Sleep -Seconds 10

          Write-Host "== 2. v2.5.3 が動いたまま新版（0.0.1）へ更新（旧版は印を持たないので閉じられて入れ替わるはず）"
          $old = (Get-App).Id
          $job = Install "dist\installer\voicekey-0.0.1-windows-setup.exe" "$env:RUNNER_TEMP\i2.log"
          $sec = Finish $job "$env:RUNNER_TEMP\i2.log" "0.0.1"
          if (Get-Process -Id $old -ErrorAction SilentlyContinue) { throw "v2.5.3 のプロセスが残っています" }
          Assert-NewAlive $old "$env:RUNNER_TEMP\i2.log" "v2.5.3 からの更新（$sec 秒）"

          Write-Host "== 3. 旧プロセスが途中で終わる更新（0.0.1 → 0.0.2）"
          $old = (Get-App).Id
          $job = Install "dist\installer\voicekey-0.0.2-windows-setup.exe" "$env:RUNNER_TEMP\i3.log"
          # アプリが後片付けを終えて自分で終わる代わりに、3 秒後に止める
          Start-Sleep -Seconds 3
          Stop-Process -Id $old -Force
          $sec = Finish $job "$env:RUNNER_TEMP\i3.log" "0.0.2"
          if ($sec -gt 25) { throw "旧プロセスが終わった後も待ち続けています（$sec 秒）" }
          Assert-NewAlive $old "$env:RUNNER_TEMP\i3.log" "旧プロセスが終わる更新（$sec 秒）"

          Write-Host "== 4. 新版が終わらないまま更新（0.0.2 → 0.0.1 を上書き。30 秒待ってから閉じるはず）"
          $old = (Get-App).Id
          $job = Install "dist\installer\voicekey-0.0.1-windows-setup.exe" "$env:RUNNER_TEMP\i4.log"
          $sec = Finish $job "$env:RUNNER_TEMP\i4.log" "0.0.1"
          if ($sec -lt 28) { Get-Content "$env:RUNNER_TEMP\i4.log" -Tail 40; throw "実行中の印（ミューテックス）を待たずに進みました（$sec 秒）" }
          if (Get-Process -Id $old -ErrorAction SilentlyContinue) { throw "旧プロセスが残っています" }
          Assert-NewAlive $old "$env:RUNNER_TEMP\i4.log" "強制で閉じる更新（$sec 秒）"

      - name: ログの保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-e2e-logs
          path: |
            ${{ runner.temp }}\i*.log
          if-no-files-found: ignore
