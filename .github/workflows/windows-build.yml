# Windows 版インストーラを GitHub Actions（windows-latest）でビルドし、既存の GitHub Release へ添付する。
#
# 目的: Mac から PC をまたがずに Windows 版（personal 版・ログイン無し）を配布する。
#
# 運用（リリースは Mac 版が先に作る）:
#   1. Mac で build_release.sh → gh release create v<版>（appcast 付き）を済ませる
#   2. gh workflow run windows-build.yml -f version=<版>
#      → ビルド → 鍵の混入チェック → Release v<版> へ voicekey-<版>-windows-setup.exe を添付
#   3. Mac で署名して .sig を同じ Release へ足す（秘密鍵は CI に置かない）:
#        gh release download v<版> -p voicekey-<版>-windows-setup.exe -D dist/ci/
#        python scripts/build/sign_update.py --exe dist/ci/voicekey-<版>-windows-setup.exe
#        gh release upload v<版> dist/ci/voicekey-<版>-windows-setup.exe.sig
#   アプリ（src/utils/updater.py）は Latest に exe と .sig が両方そろってから更新を知らせる。
#
# Release v<版> が無いときは新しく作らず失敗させる。Windows 側で Release を作ると appcast.xml の
# 無い Latest ができ、Mac の自動更新（Sparkle）が黙って止まるため。
#
# セキュリティ:
# - ビルドに API キーは一切渡さない（プロバイダーの GitHub Secrets も使わない）。利用者は設定画面で
#   自分のキーを入れる。build_windows_dist.ps1 が PyInstaller 後に verify_no_embedded_keys.py で
#   exe にキーが混ざっていないことを検査し、混ざっていれば添付まで進まない。

name: Windows ビルド

on:
  workflow_dispatch:
    inputs:
      version:
        description: "リリースバージョン（例: 2.4.0。Release v<この値> が先にあること）"
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    # 既存 Release への資産の添付に書き込み権限が要る
    permissions:
      contents: write

    steps:
      - name: バージョン書式の検証
        shell: pwsh
        run: |
          if ("${{ inputs.version }}" -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "version は X.Y.Z 形式で指定してください: ${{ inputs.version }}"
          }

      - uses: actions/checkout@v4

      - name: 添付先の Release v<版> があるか確認（無ければ作らずに止める）
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ inputs.version }}" --repo ${{ github.repository }} --json tagName | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Release v${{ inputs.version }} がありません。先に Mac で build_release.sh と gh release create（appcast 付き）を済ませてください。Windows 側では Release を作りません（appcast の無い Latest で Mac の自動更新が止まるため）"
            exit 1
          }

      - uses: actions/setup-python@v5
        with:
          # torch の Windows wheel が確実にある 3.12 に固定（ローカル 3.14 とは別）
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージのインストール
        run: pip install -r requirements.txt

      - name: Inno Setup 6 の確認（ランナーに無ければ導入）
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: 配布ビルド（PyInstaller → 鍵の混入チェック → Inno Setup）
        shell: pwsh
        env:
          # PyInstaller が python312.dll を見つけられない既知問題（setup-python の Windows）対策。
          # setup-python が公開する pythonLocation（DLL のある install ルート）を PYTHONHOME に渡す。
          PYTHONHOME: ${{ env.pythonLocation }}
          # Windows ランナーの Python stdout 既定（cp1252）だと日本語の print が
          # UnicodeEncodeError になる。UTF-8 モードを有効化してステップ全体をカバーする。
          PYTHONUTF8: "1"
        run: powershell -ExecutionPolicy Bypass -File scripts\build\build_windows_dist.ps1 -Version "${{ inputs.version }}"

      - name: Release v<版> へインストーラを添付
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 資産名の規則は src/utils/updater.py の WINDOWS_ASSET_NAME と揃える。
          # --clobber で同名の資産を置き換える（再実行を冪等にする）。作り直した exe には古い署名が
          # 合わないので、先に古い .sig を消す（残すとアプリが更新を知らせた後に署名エラーで止まる。
          # 消しておけば .sig を上げ直すまで「更新なし」で待つ）。無いときの失敗は無視する
          gh release delete-asset "v${{ inputs.version }}" `
            "voicekey-${{ inputs.version }}-windows-setup.exe.sig" `
            --repo ${{ github.repository }} --yes 2>&1 | Out-Null
          gh release upload "v${{ inputs.version }}" `
            --repo ${{ github.repository }} `
            --clobber `
            "dist/installer/voicekey-${{ inputs.version }}-windows-setup.exe"
          if ($LASTEXITCODE -ne 0) { Write-Error "Release への添付に失敗しました"; exit 1 }
          Write-Host "添付しました。次は Mac で署名（.sig）を作って同じ Release へ上げてください（このファイル冒頭の手順 3）"
